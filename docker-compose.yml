services:

  # ===========================================================================
  # Service 1: DATABASE — FAISS Vector Database
  #   Port: 8002
  # ===========================================================================
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    container_name: hybrid_rag_database
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8002
    volumes:
      - faiss_data:/app/faiss_index
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rag-network

  # ===========================================================================
  # Service 2: BACKEND — FastAPI RAG APIs
  #   Port: 8001
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hybrid_rag_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8001
      - DATABASE_URL=http://database:8002
    volumes:
      - ./docs:/app/docs
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - rag-network

  # ===========================================================================
  # Service 3: FRONTEND — Streamlit UI
  #   Port: 8000
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hybrid_rag_frontend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - BACKEND_URL=http://backend:8001
      - STREAMLIT_SERVER_PORT=8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - rag-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  faiss_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  rag-network:
    driver: bridge
